    cp .env.example .env
    docker compose up --build
    ```

    Access:
    - Frontend: http://localhost:5173
    - Backend API: http://localhost:8000
    - API Docs: http://localhost:8000/docs

    Offline demo mode:
    ```bash
    DEMO_MODE=true \
    WATSONX_ENABLED=false \
    NETWORK_REQUIRED=false \
    docker compose up --build
    ```

    Preflight check:
    ```bash
    docker compose run --rm backend python scripts/preflight_demo.py
    ```

  evaluation_metrics:
    - "Affected shipment classification F1: 0.90+ on synthetic ground truth"
    - "Cold-chain excursion recall: 0.98+"
    - "Cold-chain false-positive rate: <0.05"
    - "Route hard-constraint violations: 0%"
    - "Feasible route alternatives generated: 3+ when feasible"
    - "Offline scenario processing time: <2 seconds for 500 shipments"
    - "API p95 (excluding LLM explanation): <500 ms"
    - "AI explanation timeout: 2.5 seconds with deterministic fallback"
    - "Recommendations with evidence links: 100%"
    - "Recommendations with reason codes: 100%"
    - "Time from scenario activation to action plan: <60 seconds"
    - "Demo mode external dependencies: 0"

  known_limitations: |
    - Regulatory scope: The system uses configurable policy profiles for cold-chain classification. Demo profiles are based on CDC vaccine storage guidelines but are not authoritative for any specific product or jurisdiction.
    - Offline routing: Route alternatives are generated from a cached graph; live traffic and real-time carrier availability are not integrated.
    - Explanation latency: Granite explanations have a 2.5-second timeout; if watsonx.ai is unavailable, the system falls back to deterministic templates.
    - Synthetic data: All demo scenarios use synthetic shipments, assets, and sensor logs. No real customer, client, or personal data is included.
    - Deployment: The system is designed for local deployment. Cloud services (watsonx.ai, Cloudant) are optional and not required for the core demo.

